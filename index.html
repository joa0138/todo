<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfe6f0">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #4a382f;
      --muted: #81736d;
      --line: #eadbd4;
      --navy: #304563;
      --navy-dark: #243650;
      --navy-pale: #e8edf5;
      --paper: #fff9f5;
      --task: #fff0ed;
      --bg: #dfe6f0;
      --grey: #858b96;
      --danger: #a65f5a;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 52px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, #f0f3f8 0, transparent 48%),
        radial-gradient(ellipse at 100% 100%, #806b63 0, transparent 34%),
        linear-gradient(145deg, #e7ecf4 0%, #d7dfeb 55%, #c9c5c6 100%);
    }
    .app { width: min(100%, 620px); margin: 0 auto; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: #8b93a0; content: ""; }
    h1 { margin: 0; color: var(--navy); font-size: clamp(30px, 7vw, 42px); letter-spacing: -.055em; line-height: 1.15; }
    .subtitle { margin: 10px 0 28px; color: var(--muted); font-size: 15px; }
    .card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 20px 55px rgba(45, 55, 73, .13), 0 5px 14px rgba(82, 59, 49, .06);
    }
    .entry { display: flex; gap: 10px; padding: 20px; }
    .entry input {
      min-width: 0;
      flex: 1;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #eadbd4;
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: #fffdfb;
      font: inherit;
      font-size: 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .entry input::placeholder { color: #aaa09b; }
    .entry input:focus { border-color: #788ba7; background: #fff; box-shadow: 0 0 0 4px rgba(48, 69, 99, .12); }
    button { font: inherit; cursor: pointer; }
    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 90px;
      height: 50px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--navy);
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s, background .15s;
    }
    .add-button:hover { background: var(--navy-dark); }
    .add-button:active { transform: scale(.97); }
    .add-button svg { width: 16px; height: 16px; }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .count { display: inline-flex; align-items: center; gap: 7px; }
    .count strong { color: var(--ink); font-weight: 750; }
    .clear-button {
      padding: 7px 0 7px 10px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      transition: color .15s;
    }
    .clear-button:hover:not(:disabled) { color: var(--danger); }
    .clear-button:disabled { cursor: default; opacity: .45; }
    .todo-list { margin: 0; padding: 0 20px; list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      margin: 0 0 9px;
      padding: 10px 12px;
      border: 1px solid #f2e2dc;
      border-radius: 14px;
      background: var(--task);
      animation: appear .2s ease-out;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .todo-check {
      position: relative;
      display: grid;
      flex: 0 0 21px;
      width: 21px;
      height: 21px;
      place-items: center;
      margin: 0;
      border: 1.5px solid #aaa8a5;
      border-radius: 8px;
      appearance: none;
      background: #fff;
      cursor: pointer;
      transition: background .16s, border-color .16s, transform .16s;
    }
    .todo-check:hover { border-color: var(--navy); transform: scale(1.06); }
    .todo-check:checked { border-color: var(--navy); background: var(--navy); }
    .todo-check:checked::after {
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      content: "";
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .todo-check:focus-visible, .delete-button:focus-visible, .add-button:focus-visible, .clear-button:focus-visible {
      outline: 3px solid rgba(48, 69, 99, .28);
      outline-offset: 3px;
    }
    .todo-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; line-height: 1.5; transition: color .16s; }
    .todo-item.done .todo-text { color: #9a8e88; text-decoration: line-through; text-decoration-color: #9a8e88; }
    .status {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 7px;
      color: #626975;
      background: #e6e7e9;
      font-size: 11px;
      font-weight: 650;
    }
    .todo-item.done .status { color: var(--navy); background: #e3e9f2; }
    .delete-button {
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: var(--grey);
      background: transparent;
      opacity: .72;
      transition: color .15s, background .15s, opacity .15s;
    }
    .delete-button:hover { color: var(--danger); background: #f9e2df; opacity: 1; }
    .delete-button svg { width: 16px; height: 16px; }
    .empty-state { padding: 34px 20px 38px; border-top: 1px solid var(--line); text-align: center; }
    .empty-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin: 0 auto 13px;
      border-radius: 16px;
      color: var(--navy);
      background: var(--navy-pale);
    }
    .empty-icon svg { width: 23px; height: 23px; }
    .empty-title { margin: 0; font-size: 14px; font-weight: 700; }
    .empty-copy { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .footer { margin-top: 17px; color: #65534c; font-size: 12px; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 34px 15px; }
      .subtitle { margin-bottom: 22px; }
      .entry { gap: 8px; padding: 15px; }
      .add-button { min-width: 74px; padding: 0 12px; }
      .list-header { padding: 0 15px; }
      .todo-list { padding: 0 15px; }
      .todo-item { gap: 9px; }
      .status { padding: 5px 7px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">MY DAILY LIST</div>
    <h1>오늘의 할 일</h1>
    <p class="subtitle">하나씩 정리하고, 가볍게 완료해 보세요.</p>

    <section class="card" aria-label="할 일 목록">
      <form class="entry" id="todo-form">
        <label for="todo-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">새 할 일</label>
        <input id="todo-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" maxlength="200" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          추가
        </button>
      </form>
      <div class="list-header">
        <span class="count" aria-live="polite"><strong id="remaining-count">0</strong>개 남음</span>
        <button class="clear-button" id="clear-completed" type="button" disabled>완료 항목 지우기</button>
      </div>
      <ul class="todo-list" id="todo-list" aria-label="할 일"></ul>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 12.5 3.2 3.2L17.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        <p class="empty-title">아직 등록된 할 일이 없어요</p>
        <p class="empty-copy">위 입력창에 오늘 할 일을 적어 보세요.</p>
      </div>
    </section>
    <p class="footer">작은 한 걸음이 오늘을 완성해요.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'daily-todos-v1';
      const form = document.querySelector('#todo-form');
      const input = document.querySelector('#todo-input');
      const list = document.querySelector('#todo-list');
      const remainingCount = document.querySelector('#remaining-count');
      const emptyState = document.querySelector('#empty-state');
      const clearCompletedButton = document.querySelector('#clear-completed');

      let todos = [];
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(saved)) {
          todos = saved.filter(item => item && typeof item.text === 'string' && typeof item.completed === 'boolean')
            .map(item => ({ id: String(item.id || makeId()), text: item.text, completed: item.completed }));
        }
      } catch (_) {
        todos = [];
      }

      function makeId() {
        return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (_) { /* 앱은 저장이 막혀도 계속 동작합니다. */ }
      }

      function render() {
        list.replaceChildren();
        const remaining = todos.filter(todo => !todo.completed).length;
        const hasCompleted = todos.some(todo => todo.completed);
        remainingCount.textContent = String(remaining);
        emptyState.hidden = todos.length > 0;
        clearCompletedButton.disabled = !hasCompleted;

        for (const todo of todos) {
          const item = document.createElement('li');
          item.className = `todo-item${todo.completed ? ' done' : ''}`;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'todo-check';
          checkbox.checked = todo.completed;
          checkbox.setAttribute('aria-label', `${todo.text} 완료 표시`);
          checkbox.addEventListener('change', () => {
            todo.completed = checkbox.checked;
            save();
            render();
          });

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = todo.text;

          const status = document.createElement('span');
          status.className = 'status';
          status.textContent = todo.completed ? '완료' : '진행 중';

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'delete-button';
          remove.setAttribute('aria-label', `할 일 삭제: ${todo.text}`);
          remove.title = '삭제';
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11m-9.5 0 .6 10h7.8L15 6M8 6V4h4v2m-3 3v4m2-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener('click', () => {
            todos = todos.filter(entry => entry.id !== todo.id);
            save();
            render();
            input.focus();
          });

          item.append(checkbox, text, status, remove);
          list.append(item);
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        todos.unshift({ id: makeId(), text, completed: false });
        save();
        render();
        input.value = '';
        input.focus();
      });

      clearCompletedButton.addEventListener('click', () => {
        todos = todos.filter(todo => !todo.completed);
        save();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
